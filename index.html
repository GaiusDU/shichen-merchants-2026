<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世尘商家档案 · 买手合作品牌清单 2026</title>
<style>

  :root {
    --accent: #C8445A;
    --accent-deep: #8B2535;
    --accent-light: #F5E8EB;
    --accent-mid: #E8B4BE;
    --gold: #D4956A;
    --gold-light: #FAF0E8;
    --bg: #FDF8F6;
    --card-bg: #FFFFFF;
    --text: #2D1F1A;
    --text-mute: #7A5C54;
    --border: #EDE0D8;
    --shadow: 0 8px 32px rgba(200,68,90,.12);
    --shadow-card: 0 4px 18px rgba(45,31,26,.06);
    --shadow-hover: 0 14px 40px rgba(200,68,90,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system,'PingFang SC','Hiragino Sans GB',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* ===== Hero ===== */
  .hero {
    background: linear-gradient(135deg,#3D1018 0%,#8B2535 40%,#C8445A 70%,#D4956A 100%);
    color: white; text-align:center; padding:48px 24px 40px; position:relative; overflow:hidden;
  }
  .hero::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 70% 30%,rgba(212,149,106,.3) 0%,transparent 60%); pointer-events:none;}
  .hero-badge { display:inline-block; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); border-radius:20px; padding:4px 14px; font-size:12px; letter-spacing:.08em; margin-bottom:14px; position:relative; }
  .hero h1 { font-size:30px; font-weight:700; letter-spacing:.02em; margin-bottom:8px; position:relative; }
  .hero h1 .em { color:#FFD4A0; }
  .hero p { font-size:13px; opacity:.85; margin-bottom:26px; position:relative; }
  .stats { display:flex; justify-content:center; gap:36px; position:relative; }
  .stat-num { display:block; font-size:28px; font-weight:700; color:#FFD4A0; }
  .stat-label { font-size:12px; opacity:.7; margin-top:2px; display:block; }
  .ver-tag { position:absolute; top:14px; right:18px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.25); color:#FFD4A0; font-size:11px; padding:3px 10px; border-radius:12px; letter-spacing:.05em; }

  /* ===== Toolbar (sticky) ===== */
  .toolbar { position:sticky; top:0; z-index:100; background:rgba(253,248,246,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:12px 20px 10px; }
  .toolbar-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
  .search-box { display:flex; align-items:center; background:white; border:1.5px solid var(--border); border-radius:20px; padding:5px 14px; flex:0 0 320px; max-width:90vw; transition:border-color .15s; }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box input { flex:1; border:none; outline:none; font-size:13px; font-family:inherit; background:transparent; color:var(--text); }
  .search-box svg { flex-shrink:0; opacity:.5; margin-right:6px; }
  .select-pill { font-size:12px; padding:5px 12px 5px 12px; border:1.5px solid var(--border); border-radius:20px; background:white; color:var(--text-mute); font-family:inherit; cursor:pointer; outline:none; }
  .select-pill:focus { border-color: var(--accent); color:var(--accent); }
  .filter-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .filter-btn { border:1.5px solid var(--border); background:white; color:var(--text-mute); padding:5px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; transition:all .2s; font-family:inherit; white-space:nowrap; }
  .filter-btn:hover { border-color:var(--accent); color:var(--accent); }
  .filter-btn.active { background:var(--accent); border-color:var(--accent); color:white; font-weight:600; }

  /* ===== Grid (C方案: 多列卡, 中等方图) ===== */
  .grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap:18px;
    max-width:1500px;
    margin:0 auto;
    padding:24px 20px 100px;
    align-items:start;
  }

  .card {
    background:var(--card-bg);
    border-radius:18px;
    border:1px solid var(--border);
    overflow:hidden;
    transition: box-shadow .25s, transform .25s;
    position:relative;
    box-shadow: var(--shadow-card);
  }
  .card:hover { box-shadow: var(--shadow-hover); transform:translateY(-2px); }
  .card.hidden { display:none; }

  /* 删除按钮 */
  .del-btn {
    position:absolute; top:14px; right:14px;
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.92); border:1px solid var(--border);
    color:var(--text-mute); cursor:pointer; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s,background .15s,color .15s; z-index:3;
    backdrop-filter: blur(4px);
  }
  .card:hover .del-btn { opacity:1; }
  .del-btn:hover { background:var(--accent); color:white; border-color:var(--accent); }

  /* 卡顶 Banner: 品牌信息 (v3 紧凑版) */
  .brand-banner {
    padding: 14px 16px 12px;
    background: linear-gradient(180deg, var(--accent-light) 0%, transparent 100%);
    border-bottom: 1px dashed var(--border);
  }
  .banner-top { display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  .banner-main { flex:1; min-width:0; }
  .tag {
    display:inline-block; font-size:10.5px; font-weight:600;
    padding:2px 9px; border-radius:18px; margin-bottom:6px;
    letter-spacing:.04em;
  }
  .tag-soft   { background:#F4D0D5; color:#7A3045; }
  .tag-mixed  { background:#D0DEF4; color:#1A4A6A; }
  .tag-wood   { background:#D0F4DC; color:#1A5A35; }
  .tag-bed    { background:#F4ECD0; color:#5A4A1A; }
  .tag-desk   { background:#E8D0F4; color:#3A1A5A; }
  .tag-ka     { background:#F4D0D0; color:#6A1A1A; }
  .tag-new    { background:#D0F4F0; color:#1A5A55; }
  .tag-original { background:#F3E5F5; color:#8E24AA; }

  .brand-name { font-size:17px; font-weight:700; margin-bottom:2px; line-height:1.25; color:var(--accent-deep); }
  .shop-name  { font-size:11.5px; color:var(--text-mute); margin-bottom:7px; }

  .meta-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .meta-pill  {
    font-size:10.5px; background:white; border:1px solid var(--border);
    border-radius:12px; padding:2px 8px; color:var(--text-mute);
    display:inline-flex; align-items:center; gap:3px;
  }

  .brand-desc {
    font-size:11.5px; color:var(--text-mute); line-height:1.55; margin-bottom:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .banner-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .link-btn {
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 11px; border-radius:16px; font-size:11.5px;
    text-decoration:none; background:var(--accent); color:white;
    font-weight:500; transition:background .15s, transform .1s;
  }
  .link-btn:hover { background:var(--accent-deep); transform:translateY(-1px); }
  .link-btn.secondary { background:transparent; color:var(--accent); border:1.2px solid var(--accent-mid); }
  .link-btn.secondary:hover { background:var(--accent-light); color:var(--accent-deep); }
  .buyer-chip {
    background:var(--gold-light); color:var(--accent-deep);
    padding:2px 9px; border-radius:12px;
    font-size:10.5px; font-weight:500;
    display:inline-flex; align-items:center; gap:3px;
  }

  /* Top3 商品区 - v3 中等方图 120x120 */
  .products-wrap { padding: 12px 16px 16px; }
  .products-title {
    font-size:11.5px; font-weight:600; color:var(--text-mute);
    letter-spacing:.06em; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .products-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .product-card {
    background:var(--bg);
    border-radius:10px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--border);
    transition: transform .2s, box-shadow .2s;
    display:flex; flex-direction:column;
  }
  .product-card:hover { box-shadow: 0 6px 16px rgba(45,31,26,.1); }
  .product-img-wrap {
    width:100%; aspect-ratio: 1/1;
    overflow:hidden; background:#F0E6E0;
    position:relative;
    border-radius:8px 8px 0 0;
  }
  .product-img-wrap img {
    width:100%; height:100%; object-fit:cover;
    transition: transform .35s ease;
    display:block;
  }
  .product-card:hover .product-img-wrap img { transform: scale(1.06); }
  .product-img-fallback {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:42px; color:var(--gold); background:var(--gold-light);
  }
  .rank-badge {
    position:absolute; top:6px; right:6px;
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
    background:rgba(255,255,255,.94); backdrop-filter:blur(4px);
    box-shadow: 0 2px 6px rgba(0,0,0,.14);
    border: 1.5px solid white;
    z-index:2;
  }
  .product-body { padding: 8px 9px 10px; flex:1; display:flex; flex-direction:column; }
  .product-cat {
    font-size:10px; color:var(--text-mute);
    margin-bottom:3px; letter-spacing:.04em;
  }
  .product-name {
    font-size:12px; font-weight:500; line-height:1.4;
    color:var(--text); margin-bottom:6px;
    /* v3: 完整商品名，最多 3 行，超出再省略 */
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
    flex:1;
  }
  .product-price {
    font-size:14px; font-weight:700; color:#FF2442;
    margin-top:auto;
  }
  .product-price.empty { font-size:11.5px; color:var(--text-mute); font-weight:normal; }

  /* ===== Floating actions (right center) ===== */
  .fab-wrap {
    position:fixed; right:20px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:10px; z-index:1000;
  }
  .fab {
    display:flex; align-items:center; gap:8px;
    padding:11px 16px; border-radius:30px;
    color:white; font-size:13px; font-weight:600;
    border:none; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.18);
    transition:transform .15s, box-shadow .15s;
    font-family:inherit;
  }
  .fab:hover { transform:scale(1.04); box-shadow:0 6px 22px rgba(0,0,0,.24); }
  .fab-add { background:linear-gradient(135deg,#C8445A,#8B2535); }
  .fab-chat { background:linear-gradient(135deg,#5A3FC8,#3A2A8B); }

  /* ===== Wecom CTA (large right-side pill) ===== */
  .cta-wecom {
    position:fixed; right:20px; top:50%; transform:translateY(-50%);
    width:240px; min-height:56px; padding:8px 18px;
    background:linear-gradient(135deg,#2E76EE,#1E5BC4);
    color:#fff; border:none; border-radius:32px;
    box-shadow:0 8px 24px rgba(46,118,238,.45), 0 2px 6px rgba(0,0,0,.18);
    cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    z-index:1000; transition:box-shadow .2s, transform .2s;
    animation:ctaBreath 3.6s ease-in-out infinite;
  }
  .cta-wecom:hover {
    box-shadow:0 12px 32px rgba(46,118,238,.55), 0 4px 10px rgba(0,0,0,.22);
    animation-play-state:paused;
  }
  .cta-wecom .cta-main { font-size:16px; font-weight:700; line-height:1.25; letter-spacing:.3px; }
  .cta-wecom .cta-sub  { font-size:12px; opacity:.82; line-height:1.2; font-weight:500; }
  @keyframes ctaBreath {
    0%,100% { transform:translateY(-50%) scale(1); }
    50%     { transform:translateY(-50%) scale(1.03); }
  }
  @media(max-width:768px){
    .cta-wecom {
      top:auto; right:auto;
      left:5%; bottom:20px; width:90%;
      transform:none;
      animation:ctaBreathMobile 3.6s ease-in-out infinite;
      flex-direction:row; gap:10px; padding:10px 18px;
    }
    .cta-wecom .cta-main { font-size:15px; }
    .cta-wecom .cta-sub  { font-size:11.5px; }
    @keyframes ctaBreathMobile {
      0%,100% { transform:scale(1); }
      50%     { transform:scale(1.02); }
    }
  }

  /* ===== Wecom QR Modal ===== */
  .wecom-mask { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2200; display:none; align-items:center; justify-content:center; padding:20px; animation:fadeIn .18s ease; }
  .wecom-mask.show { display:flex; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .wecom-card { background:#fff; border-radius:18px; max-width:360px; width:100%; padding:22px 22px 18px; box-shadow:0 20px 60px rgba(0,0,0,.35); position:relative; text-align:center; animation:popIn .22s ease; }
  @keyframes popIn { from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;} }
  .wecom-close { position:absolute; top:10px; right:12px; width:30px; height:30px; border:none; background:transparent; font-size:22px; line-height:1; color:#999; cursor:pointer; border-radius:50%; transition:background .15s, color .15s; }
  .wecom-close:hover { background:#f3f3f3; color:#333; }
  .wecom-title { font-size:18px; font-weight:700; color:#1d1d1f; margin-bottom:4px; }
  .wecom-sub { font-size:13px; color:#86868b; margin-bottom:14px; }
  .wecom-qr { display:block; width:100%; max-width:300px; height:auto; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(46,118,238,.18); }
  .wecom-tip { font-size:12.5px; color:#2E76EE; background:#EAF1FE; padding:8px 12px; border-radius:8px; margin-top:12px; line-height:1.5; font-weight:500; }
  .wecom-hint { font-size:11.5px; color:#b0b0b5; margin-top:8px; }
  @media(max-width:480px){
    .wecom-card { max-width:90vw; padding:20px 18px 16px; }
    .wecom-qr { max-width:260px; }
  }

  /* ===== Modal ===== */
  .modal-mask { position:fixed; inset:0; background:rgba(45,31,26,.45); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-mask.show { display:flex; }
  .modal { background:white; border-radius:16px; max-width:600px; width:100%; max-height:92vh; overflow:auto; padding:24px 24px; box-shadow:0 16px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size:18px; font-weight:700; margin-bottom:6px; color:var(--text); }
  .modal h3 .em { color:var(--accent); }
  .modal .sub { font-size:12.5px; color:var(--text-mute); margin-bottom:18px; line-height:1.6; }
  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--text); }
  .form-label .req { color:var(--accent); }
  .form-input, .form-select, .form-textarea {
    width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; color:var(--text); background:white; outline:none;
    transition:border-color .15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
  .form-textarea { resize:vertical; min-height:64px; }
  .form-hint { font-size:11px; color:var(--text-mute); margin-top:4px; line-height:1.5; }
  .form-row { display:flex; gap:10px; }
  .form-row > * { flex:1; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
  .btn { padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:inherit; transition:all .15s; }
  .btn-primary { background:var(--accent); color:white; }
  .btn-primary:hover { background:var(--accent-deep); }
  .btn-primary:disabled { background:#D0BAB4; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--text-mute); border:1.5px solid var(--border); }
  .btn-ghost:hover { background:var(--bg); }
  .btn-magic {
    background: linear-gradient(135deg, #C8445A, #D4956A);
    color: white; padding:10px 18px;
    box-shadow: 0 3px 10px rgba(200,68,90,.25);
  }
  .btn-magic:hover { box-shadow: 0 5px 15px rgba(200,68,90,.35); }
  .btn-magic:disabled { background:#D0BAB4; box-shadow:none; cursor:not-allowed; }

  /* Top3 拉取预览块 */
  .preview-box {
    background: linear-gradient(180deg, var(--accent-light), white);
    border:1.5px solid var(--accent-mid); border-radius:10px;
    padding:12px 14px; margin-top:12px;
    font-size:12px; color:var(--text);
  }
  .preview-box .preview-title { font-weight:600; color:var(--accent-deep); margin-bottom:8px; font-size:12.5px; }
  .preview-products { display:flex; gap:8px; flex-wrap:wrap; }
  .preview-prod { width:80px; text-align:center; }
  .preview-prod img { width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
  .preview-prod .pn { font-size:10.5px; color:var(--text-mute); margin-top:3px; line-height:1.2; max-height:24px; overflow:hidden; }

  .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--text); color:white; padding:10px 20px; border-radius:8px; font-size:13px; z-index:3000; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; box-shadow:0 4px 16px rgba(0,0,0,.2);}
  .toast.show { opacity:1; }
  .toast.success { background:#1A5A35; }
  .toast.error { background:#7A3045; }

  .empty { text-align:center; padding:60px 20px; color:var(--text-mute); }
  .empty .icon { font-size:40px; margin-bottom:10px; }

  footer { text-align:center; padding:24px 20px; font-size:12px; color:var(--text-mute); border-top:1px solid var(--border); background:white; }

  /* DIBP chat drawer */
  .chat-drawer { position:fixed; top:0; right:-460px; width:440px; max-width:95vw; height:100vh; background:white; box-shadow:-8px 0 32px rgba(0,0,0,.18); z-index:2500; transition:right .28s ease; display:flex; flex-direction:column;}
  .chat-drawer.open { right:0; }
  .chat-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#5A3FC8,#3A2A8B); color:white;}
  .chat-header h3 { font-size:15px; font-weight:700; }
  .chat-close { background:transparent; border:none; color:white; font-size:20px; cursor:pointer; line-height:1; padding:0 4px; }
  .chat-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; background:var(--bg); }
  .chat-msg { padding:10px 12px; border-radius:10px; max-width:88%; font-size:13px; line-height:1.55; word-wrap:break-word; white-space:pre-wrap; }
  .chat-msg.user { background:var(--accent); color:white; margin-left:auto; }
  .chat-msg.bot { background:white; color:var(--text); border:1px solid var(--border); }
  .chat-msg.bot pre, .chat-msg.bot code { background:#F4F0EC; padding:2px 6px; border-radius:4px; font-size:12px; font-family:Menlo,monospace; white-space:pre-wrap;}
  .chat-loading { color:var(--text-mute); font-size:12px; text-align:center; padding:6px 0; }
  .chat-input-wrap { padding:12px 14px; border-top:1px solid var(--border); background:white; display:flex; gap:8px; }
  .chat-input { flex:1; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; outline:none; font-family:inherit; }
  .chat-input:focus { border-color:#5A3FC8; }
  .chat-send { padding:9px 16px; background:#5A3FC8; color:white; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; }
  .chat-send:disabled { background:#B5B0CC; cursor:not-allowed; }
  .chat-quick { display:flex; gap:6px; flex-wrap:wrap; padding:8px 14px 0; }
  .chat-quick-btn { background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:4px 10px; font-size:11.5px; color:var(--text-mute); cursor:pointer; font-family:inherit;}
  .chat-quick-btn:hover { background:var(--accent-light); color:var(--accent); border-color:var(--accent-mid);}

  /* ===== 响应式 ===== */
  @media(max-width:1024px){
    .grid { grid-template-columns: 1fr; max-width: 720px; padding: 20px 16px 80px; }
    .products-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media(max-width:768px){
    .hero h1{font-size:24px;}
    .stats{gap:24px;}
    .brand-name { font-size: 16px; }
    .brand-banner { padding: 12px 14px 10px; }
    .products-wrap { padding: 10px 14px 14px; }
    .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fab-wrap{right:14px; gap:8px;}
    .fab{padding:9px 12px; font-size:12px;}
    .chat-drawer{width:100vw;}
    .modal { padding: 20px 18px; }
  }
  @media(max-width:480px){
    .grid { padding: 16px 12px 80px; gap:14px; }

  const alttoCount = allBrands.filter(b => b.special === 'altto').length;
  let html = `<button class="filter-btn active" data-cat="all">全部 (${allBrands.length})</button>`;
  html += `<button class="filter-btn filter-btn-altto" data-cat="__altto__">🌿 阿尔托风专区 (${alttoCount})</button>`;
  CAT_ORDER.forEach(c => {
    if (catCount[c]) {
      html += `<button class="filter-btn" data-cat="${c}">${tagShort[c]||c} (${catCount[c]})</button>`;
    }
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter.cat = btn.dataset.cat;
      renderGrid();
    });
  });

  const cities = Array.from(new Set(allBrands.map(b => (b.city||'').trim()).filter(Boolean))).sort();
  const citySel = document.getElementById('filter-city');
  citySel.innerHTML = '<option value="all">全部城市</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');

  const prices = Array.from(new Set(allBrands.map(b => (b.price_band||'').trim()).filter(p => p && p !== '—'))).sort();
  const priceSel = document.getElementById('filter-price');
  priceSel.innerHTML = '<option value="all">全部客单价</option>' + prices.map(p => `<option value="${p}">${p}</option>`).join('');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const q = currentFilter.q.toLowerCase();
  const filtered = allBrands.filter(b => {
    if (currentFilter.cat === '__altto__' && b.special !== 'altto') return false;
    if (currentFilter.cat !== 'all' && currentFilter.cat !== '__altto__' && b.category !== currentFilter.cat) return false;
    if (currentFilter.city !== 'all' && (b.city||'').trim() !== currentFilter.city) return false;
    if (currentFilter.price !== 'all' && (b.price_band||'').trim() !== currentFilter.price) return false;
    if (q) {
      const hay = `${b.brand} ${b.shop_name||''} ${b.main_category||''} ${b.city||''} ${b.description||''}`.toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  document.getElementById('stat-show').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="icon">🔍</div>没有匹配的商家，换个筛选条件试试？</div>`;
    return;
  }

  grid.innerHTML = filtered.map(b => {
    const products = (allProducts[b.seller_id] || []).slice().sort((a,b)=>a.rank-b.rank);
    const tCls = tagClass[b.category] || 'tag-new';
    const meta = [];
    if (b.city) meta.push(`📍 ${escapeHtml(b.city)}`);
    if (b.price_band && b.price_band !== '—') meta.push(`💰 ${escapeHtml(b.price_band)}`);
    if (b.main_category) meta.push(`🏷 ${escapeHtml(b.main_category)}`);
    const buyers = Array.isArray(b.buyers) ? b.buyers : [];

    const prodCardsHtml = products.length
      ? products.slice(0,3).map(p => {
          const badge = RANK_BADGE[p.rank] || `T${p.rank}`;
          const imgPart = p.image_url
            ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.product_name||'商品图')}" onerror="this.parentElement.innerHTML='<div class=&quot;product-img-fallback&quot;>${iconOf(p.product_category)}</div>'">`
            : `<div class="product-img-fallback">${iconOf(p.product_category)}</div>`;
          const priceHtml = (p.price && p.price > 0)
            ? `<div class="product-price">¥${p.price}</div>`
            : (p.price_raw && p.price_raw !== '—' ? `<div class="product-price">${escapeHtml(p.price_raw)}</div>` : `<div class="product-price empty">价格待补</div>`);
          return `
            <a href="https://www.xiaohongshu.com/goods-detail/${p.goods_id||''}" target="_blank" rel="noopener" class="product-card">
              <div class="rank-badge">${badge}</div>
              <div class="product-img-wrap">${imgPart}</div>
              <div class="product-body">
                <div class="product-cat">${escapeHtml(p.product_category||'家具')}</div>
                <div class="product-name" title="${escapeHtml(p.product_name||'')}">${escapeHtml(p.product_name||'—')}</div>
                ${priceHtml}
              </div>
            </a>`;
        }).join('')
      : `<div style="grid-column:1/-1;font-size:12.5px;color:var(--text-mute);padding:10px 0;text-align:center;">暂无商品数据</div>`;

    const buyersHtml = buyers.length
      ? buyers.map(x => `<span class="buyer-chip">🤝 ${escapeHtml(x)}</span>`).join('')
      : '';

    return `
      <div class="card">
        <div class="brand-banner">
          <div class="banner-top">
            <div class="banner-main">
              <span class="tag ${tCls}">${tagShort[b.category]||escapeHtml(b.category)}</span>
              <div class="brand-name">${escapeHtml(b.brand)}</div>
              <div class="shop-name">${escapeHtml(b.shop_name||'')}</div>
              <div class="meta-pills">${meta.map(m=>`<span class="meta-pill">${m}</span>`).join('')}</div>
              ${b.description ? `<div class="brand-desc">${escapeHtml(b.description)}</div>` : ''}
            </div>
          </div>
          <div class="banner-actions">
            ${b.shop_url ? `<a href="${escapeHtml(b.shop_url)}" target="_blank" rel="noopener" class="link-btn">🛍 进店选品</a>` : ''}
            ${b.profile_url ? `<a href="${escapeHtml(b.profile_url)}" target="_blank" rel="noopener" class="link-btn secondary">👤 主页</a>` : ''}
            ${buyersHtml}
          </div>
        </div>
        <div class="products-wrap">
          <div class="products-title">📦 店铺销售 Top3</div>
          <div class="products-grid">${prodCardsHtml}</div>
        </div>
      </div>`;
  }).join('');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  setTimeout(() => { t.className = 'toast '+(type||''); }, 2500);
}

function bootstrap() {
  // BRANDS_DATA 已按热度（销售规模）从高到低写死，这里保持原顺序即可
  allBrands = BRANDS_DATA.slice();
  allProducts = {};
  PRODUCTS_DATA.forEach(p => {
    if (!allProducts[p.seller_id]) allProducts[p.seller_id] = [];
    allProducts[p.seller_id].push(p);
  });
  document.getElementById('stat-total').textContent = allBrands.length;
  renderFilters();
  renderGrid();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search').addEventListener('input', e => { currentFilter.q = e.target.value; renderGrid(); });
  document.getElementById('filter-city').addEventListener('change', e => { currentFilter.city = e.target.value; renderGrid(); });
  document.getElementById('filter-price').addEventListener('change', e => { currentFilter.price = e.target.value; renderGrid(); });
  bootstrap();

  // Wecom QR modal
  const wecomMask = document.getElementById('wecom-mask');
  const openWecom = () => wecomMask.classList.add('show');
  const closeWecom = () => wecomMask.classList.remove('show');
  document.getElementById('fab-wecom').addEventListener('click', openWecom);
  document.getElementById('wecom-close').addEventListener('click', closeWecom);
  wecomMask.addEventListener('click', (e) => { if (e.target === wecomMask) closeWecom(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && wecomMask.classList.contains('show')) closeWecom(); });
});
</script>
